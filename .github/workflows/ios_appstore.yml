name: Build and Upload iOS IPA to App Store Connect

on:
  workflow_dispatch:

jobs:
  ios-release:
    name: Build & Publish iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      BUNDLE_ID: com.futbol.party.futbolParty
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Codemagic CLI Signing Tools
        run: |
          python -m pip install --upgrade pip
          pip install codemagic-cli-tools

      - name: Resolve Flutter Packages & Configure iOS Project
        run: |
          rm -f pubspec.lock
          flutter pub get
          flutter build ios --config-only --release --no-codesign

      - name: Initialize macOS Keychain & Fetch/Create Apple Signing Files
        run: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build Signed Release iOS IPA
        run: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=1 \
            --export-options-plist=$HOME/export_options.plist

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FutbolArena-iOS-IPA
          path: build/ios/ipa/*.ipa

      - name: Upload IPA to App Store Connect
        run: |
          app-store-connect publish \
            --path build/ios/ipa/*.ipa
